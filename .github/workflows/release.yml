name: release

# Creates GitHub releases from docs/releases/<tag>.md files.
#   line 1          "# <release title>"
#   "commit: <sha>" (optional) commit the release points to; default: the pushed commit
#   the rest        release notes
# For every notes file whose release does not exist yet, the release and its tag are created
# on GitHub at that commit, with that commit's firmware, models and paper attached.
on:
  push:
    paths: ["docs/releases/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for f in $(ls docs/releases/v*.md | sort -V); do
            tag=$(basename "$f" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"; continue
            fi
            sha=$(grep -m1 '^commit:' "$f" | awk '{print $2}' || true)
            sha=${sha:-$GITHUB_SHA}
            title=$(head -1 "$f" | sed 's/^# *//')
            tail -n +2 "$f" | grep -v '^commit:' > "/tmp/$tag-notes.md"
            git worktree add "/tmp/$tag" "$sha"
            assets=$(cd "/tmp/$tag" && ls firmware/release/*.bin models/*.npz models/*.onnx docs/paper/*.pdf docs/paper/*.docx 2>/dev/null | sed "s|^|/tmp/$tag/|" || true)
            echo "creating $tag ($title) at $sha"
            gh release create "$tag" --target "$sha" --title "$title" --notes-file "/tmp/$tag-notes.md" $assets
          done
